name: Build UF2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt update && sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Get SDKs
        run: |
          rm -rf pico-sdk PicoDVI build
          git clone -b 2.1.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk && git submodule update --init && cd..
          git clone --depth 1 https://github.com/Wren6991/PicoDVI.git
          cd PicoDVI && git submodule update --init && cd..
      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICODVI_PATH: ${{ github.workspace }}/PicoDVI
        run: |
          cmake -B build -S. -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --verbose -j1
      - uses: actions/upload-artifact@v4
        with:
          name: uf2
          path: build/*.uf2