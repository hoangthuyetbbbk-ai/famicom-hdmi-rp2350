name: Build Famicom HDMI UF2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt update && sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential git
      - name: Clone
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init
          git clone https://github.com/Wren6991/PicoDVI.git PicoDVI
          git -C PicoDVI submodule update --init
      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -B build -S. -DPICO_BOARD=waveshare_rp2350_pizero -DPICO_PLATFORM=rp2350 -DPICODVI_PATH=${{ github.workspace }}/PicoDVI
          cmake --build build -j4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uf2
          path: build/*.uf2